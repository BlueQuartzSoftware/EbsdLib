<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <!-- =================================================================== -->
  <!-- X||a vs X||a* — Hexagonal Cartesian-frame conventions               -->
  <!-- Companion to Data/Pole_Figure_Validation/ReadMe.md                  -->
  <!-- =================================================================== -->

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#ffffff"/>

  <!-- =================================================================== -->
  <!-- Title bar                                                            -->
  <!-- =================================================================== -->
  <text x="400" y="34" font-size="19" font-weight="600" text-anchor="middle" fill="#1a1a1a">
    X‖a  vs  X‖a*  —  Hexagonal Cartesian-frame conventions
  </text>
  <text x="400" y="54" font-size="12" text-anchor="middle" fill="#666">
    Same crystal, same physics. Only the choice of where Cartesian X points within the basal plane changes.
  </text>

  <!-- Panel separator -->
  <line x1="400" y1="78" x2="400" y2="468" stroke="#e5e5e5" stroke-width="1"/>

  <!-- =================================================================== -->
  <!-- LEFT PANEL: basal-plane geometry                                    -->
  <!-- =================================================================== -->
  <text x="200" y="98" font-size="13" font-weight="500" text-anchor="middle" fill="#333">
    Basal plane (looking down c-axis)
  </text>

  <!-- Hexagonal basal-plane outline. Vertices at math angles 240/300/0/60/120/180,
       so the a-axes (240/0/120) pass through three alternating vertices. -->
  <polygon points="132.5,406.9 267.5,406.9 335,290 267.5,173.1 132.5,173.1 65,290"
           fill="#fafafa" stroke="#bbb" stroke-width="1"/>

  <!-- Real-lattice vectors a₁ (7 o'clock), a₂ (3 o'clock), a₃ (11 o'clock).
       Each points to a vertex of the hexagon. Light gray dashed. -->
  <g stroke="#aaa" stroke-width="1.3" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-gray)">
    <line x1="200" y1="290" x2="136"   y2="400.85"/>  <!-- a₁ at math 240° -->
    <line x1="200" y1="290" x2="328"   y2="290"/>     <!-- a₂ at math   0° -->
    <line x1="200" y1="290" x2="136"   y2="179.15"/>  <!-- a₃ at math 120° -->
  </g>
  <g font-size="13" font-style="italic" fill="#777">
    <text x="115" y="420" text-anchor="end">a<tspan font-size="9" baseline-shift="sub">1</tspan></text>
    <text x="340" y="294" text-anchor="start">a<tspan font-size="9" baseline-shift="sub">2</tspan></text>
    <text x="115" y="172" text-anchor="end">a<tspan font-size="9" baseline-shift="sub">3</tspan></text>
  </g>

  <!-- Reciprocal vector a*₁ direction (also where X||a* axis points).
       Perpendicular to a₂ with positive projection on a₁ → 6 o'clock (math 270°). -->
  <line x1="200" y1="290" x2="200" y2="418" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="207" y="430" font-size="12" font-style="italic" fill="#777" text-anchor="start">
    a*<tspan font-size="9" baseline-shift="sub">1</tspan>
  </text>

  <!-- Cartesian X-axis under X‖a (red, solid arrow, along a₁ / 7 o'clock) -->
  <line x1="200" y1="290" x2="141" y2="392.19" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <text x="183" y="348" font-size="13" font-weight="600" fill="#c0392b" text-anchor="start">X</text>
  <text x="196" y="348" font-size="11" fill="#c0392b" text-anchor="start">(X‖a)</text>

  <!-- Cartesian X-axis under X‖a* (blue, solid arrow, along a*₁ / 6 o'clock) -->
  <line x1="200" y1="290" x2="200" y2="410" stroke="#2980b9" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <text x="218" y="376" font-size="13" font-weight="600" fill="#2980b9" text-anchor="start">X</text>
  <text x="231" y="376" font-size="11" fill="#2980b9" text-anchor="start">(X‖a*)</text>

  <!-- 30° arc between the two X-axes (from X‖a at 240° to X‖a* at 270°, r=45) -->
  <path d="M 177.5 328.97 A 45 45 0 0 0 200 335" fill="none" stroke="#444" stroke-width="1.4"/>
  <text x="172" y="354" font-size="11" font-weight="500" fill="#444">30°</text>

  <!-- Origin dot -->
  <circle cx="200" cy="290" r="3.2" fill="#1a1a1a"/>

  <!-- Caption -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="200" y="445">a*<tspan font-size="9" baseline-shift="sub">1</tspan> is perpendicular to (a<tspan font-size="9" baseline-shift="sub">2</tspan>, c) — rotated 30° from a<tspan font-size="9" baseline-shift="sub">1</tspan> within the basal plane.</text>
    <text x="200" y="461">Picking the Cartesian X-axis along a<tspan font-size="9" baseline-shift="sub">1</tspan> (red) or a*<tspan font-size="9" baseline-shift="sub">1</tspan> (blue) is a 30° choice.</text>
  </g>

  <!-- =================================================================== -->
  <!-- RIGHT PANEL: pole-figure consequence                                -->
  <!-- =================================================================== -->
  <text x="600" y="98" font-size="13" font-weight="500" text-anchor="middle" fill="#333">
    Same (10-10) plane normal — two pole-figure positions
  </text>

  <!-- Disk -->
  <circle cx="600" cy="290" r="100" fill="#fafafa" stroke="#bbb" stroke-width="1"/>

  <!-- Reference cross inside disk -->
  <g stroke="#d8d8d8" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="500" y1="290" x2="700" y2="290"/>
    <line x1="600" y1="190" x2="600" y2="390"/>
  </g>
  <g font-size="10" fill="#a8a8a8">
    <text x="708" y="293">+x</text>
    <text x="603" y="186">+y</text>
  </g>

  <!-- Position under X||a — at (0.866, 0.5), upper right -->
  <line x1="600" y1="290" x2="686.6" y2="240" stroke="#c0392b" stroke-width="1.3"/>
  <circle cx="686.6" cy="240" r="5.5" fill="#c0392b"/>
  <text x="694" y="232" font-size="11" font-weight="600" fill="#c0392b">X‖a</text>
  <text x="694" y="246" font-size="10" fill="#c0392b">(0.866, 0.5)</text>

  <!-- Position under X||a* — at (1, 0), on +x axis -->
  <line x1="600" y1="290" x2="700" y2="290" stroke="#2980b9" stroke-width="1.3"/>
  <circle cx="700" cy="290" r="5.5" fill="#2980b9"/>
  <text x="710" y="285" font-size="11" font-weight="600" fill="#2980b9">X‖a*</text>
  <text x="710" y="299" font-size="10" fill="#2980b9">(1, 0)</text>

  <!-- 30° arc inside the disk — from blue (angle 0°) to red (angle 30°) -->
  <path d="M 635 290 A 35 35 0 0 0 630.31 272.50" fill="none" stroke="#444" stroke-width="1.4"/>
  <text x="643" y="280" font-size="11" font-weight="500" fill="#444">30°</text>

  <!-- Origin dot -->
  <circle cx="600" cy="290" r="3.2" fill="#1a1a1a"/>

  <!-- Caption -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="600" y="445">The plane normal of (10-10) is a*<tspan font-size="9" baseline-shift="sub">1</tspan> — same physical direction in both frames.</text>
    <text x="600" y="461">Its Cartesian (x, y) — and so its pole-figure position — rotates by 30°.</text>
  </g>

  <!-- =================================================================== -->
  <!-- Footer band                                                          -->
  <!-- =================================================================== -->
  <rect x="0" y="478" width="800" height="42" fill="#f7f7f7"/>
  <text x="400" y="497" font-size="11" text-anchor="middle" fill="#444">
    EbsdLib v3 uses X‖a* for hexagonal/trigonal Laue classes — matching MTEX and Oxford / HKL acquisition systems.
  </text>
  <text x="400" y="512" font-size="10" text-anchor="middle" fill="#777">
    See Data/Pole_Figure_Validation/ReadMe.md for the full per-Laue-class convention table and validation methodology.
  </text>
</svg>
